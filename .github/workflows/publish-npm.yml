name: Publish @cfbeg/terabox-api

on:
  workflow_dispatch:
  push:
    tags:
      - 'lightweight-v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish NPM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: PNPM Setup
        uses: pnpm/action-setup@v5
        with:
          version: 10
      - name: Setup NodeJS
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Verify lightweight source
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/lightweight" ]]
          else
            git fetch origin lightweight:refs/remotes/origin/lightweight
            git merge-base --is-ancestor "$GITHUB_SHA" origin/lightweight
            [[ "$GITHUB_REF_NAME" == "lightweight-v$(node -p "require('./package.json').version")" ]]
          fi
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check
        run: pnpm lint && pnpm test
      - name: Publish
        run: npm publish --access public
